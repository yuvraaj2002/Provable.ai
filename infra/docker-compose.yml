version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: provable-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: provable_db
      POSTGRES_USER: provable_user
      POSTGRES_PASSWORD: provable_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provable_user -d provable_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: provable-redis
    restart: unless-stopped

    ports:
      - "6379:6379"   # optional – remove if only FastAPI uses it

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
